name: Deploy portfolio site
on:
    push:
        branches: [main]
    workflow_dispatch:
permissions:
    contents: write
    pages: write
    id-token: write
concurrency:
    group: pages
    cancel-in-progress: true
jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4
            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Install dependencies
              run: pnpm install --no-frozen-lockfile
            - name: Install Chromium and Korean font
              run: |
                  pnpm exec playwright install --with-deps chromium
                  sudo apt-get update
                  sudo apt-get install -y fonts-noto-cjk
            - name: Capture actual public project sites
              run: node scripts/capture-project-screenshots.mjs
            - name: Version production screenshots for branch-based Pages
              run: |
                  if [ -n "$(git status --porcelain -- site/assets/project-previews)" ]; then
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git add site/assets/project-previews
                      git commit -m "Save real site screenshots for portfolio [skip ci]"
                      git push
                  fi
            - name: Generate PDF from source
              run: |
                  pnpm pdf
                  mkdir -p site/downloads
                  cp exports/sk-aigen-portfolio.pdf site/downloads/sk-aigen-portfolio.pdf
            - name: Pre-render complete static site
              run: pnpm build:site
            - name: Configure Pages
              uses: actions/configure-pages@v5
            - name: Upload static site and PDF
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./site
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
